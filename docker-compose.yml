name: 'tiamat'

services:
  db:
    container_name: '${COMPOSE_PROJECT_NAME}_postgis17'
    # Matches the major version running in production, so that a production dump restores
    # locally and local behaviour is the behaviour that ships. postgis publishes this image
    # for amd64 only, hence the platform pin below on Apple silicon.
    image: 'postgis/postgis:17-master'
    hostname: postgres
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_USER: tiamat
      POSTGRES_PASSWORD: tiamat
      POSTGRES_HOST: postgres
    ports:
      - "37432:5432"
    volumes:
      # Must be the PGDATA path itself. The image declares VOLUME /var/lib/postgresql/data,
      # and docker honours that independently: mounting the parent leaves the declaration
      # unsatisfied, so postgres writes to an anonymous volume created for the deeper path
      # and this named volume holds nothing. The database then does not survive the
      # container being recreated.
      #
      # Named per major version because postgres refuses to start against a data directory
      # written by a different major, so a shared name would leave everyone with a container
      # that will not boot rather than a working empty database.
      - postgres-data-17:/var/lib/postgresql/data
    networks:
      - tiamat-net

  localstack:
    container_name: "${COMPOSE_PROJECT_NAME}_localstack"
    profiles: ["aws"]
    image: localstack/localstack:4.0
    ports:
      - "37566:4566"             # LocalStack Gateway
      - "37510-37559:4510-4559"  # external services port range
    environment:
      - DEBUG=${DEBUG-}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DISABLE_EVENTS=1
      - SERVICES=s3,cloudwatch
      - AWS_ACCESS_KEY_ID=localstack
      - AWS_SECRET_ACCESS_KEY=localstack
      - AWS_DEFAULT_REGION=eu-north-1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh"
    networks:
      - tiamat-net

volumes:
  postgres-data-17:

networks:
  tiamat-net:
